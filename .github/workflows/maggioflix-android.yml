name: MaggioFlix

# Compila MaggioFlix per Android (TV e telefono), Windows e Mac a ogni modifica
# su main (o a mano dalla scheda Actions) e pubblica tutto nella stessa release,
# così l'ultima versione si scarica sempre dallo stesso indirizzo:
#   https://github.com/<account>/<repo>/releases/latest/download/<file>
#
# File: maggioflix-arm64-v8a.apk, maggioflix-armeabi-v7a.apk,
#       maggioflix-windows-installer.exe, maggioflix-windows-x64-portable.zip,
#       maggioflix-macos.dmg
#
# Firma Android: secret MAGGIOFLIX_KEYSTORE_BASE64 e MAGGIOFLIX_KEYSTORE_PASSWORD
# (alias maggioflix). Windows e Mac non sono firmati: al primo avvio il sistema
# chiede conferma.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "website/**"
      - "ios/**"
      - "tvos/**"
      - "linux/**"
      - "server/**"
      - ".github/workflows/maggioflix-live.yml"
      - "Casks/**"

concurrency:
  group: maggioflix-build
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.1"

jobs:
  apk:
    if: github.repository != 'edde746/plezy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.MAGGIOFLIX_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MAGGIOFLIX_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Mancano i secret MAGGIOFLIX_KEYSTORE_BASE64 / MAGGIOFLIX_KEYSTORE_PASSWORD (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache Pub and Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: maggioflix-${{ runner.os }}-${{ hashFiles('pubspec.lock', '**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: maggioflix-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile --no-example

      - name: Configure signing
        env:
          KEYSTORE_B64: ${{ secrets.MAGGIOFLIX_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MAGGIOFLIX_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties << EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=maggioflix
          storeFile=upload-keystore.jks
          EOF

      - name: Build APKs
        # Versione MaggioFlix: v3.<numero della build>. Il versionCode cresce sempre
        # (1000 + build) così Android accetta l'aggiornamento sopra le versioni 2.x.
        run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64 --build-name=3.${{ github.run_number }}.0 --build-number=$((1000 + ${{ github.run_number }})) --dart-define=GIT_COMMIT=${{ github.sha }} --dart-define=MAGGIOFLIX_BUILD=${{ github.run_number }}

      - name: Build App Bundle (Google Play)
        # Per il Play Store serve l'AAB. versionCode 3000 + build: mai più basso
        # dell'APK installato da GitHub (arm64 = 2000 + 1000 + build).
        run: flutter build appbundle --release --build-name=3.${{ github.run_number }}.0 --build-number=$((3000 + ${{ github.run_number }})) --dart-define=GIT_COMMIT=${{ github.sha }} --dart-define=MAGGIOFLIX_BUILD=${{ github.run_number }}

      - name: Clean up keystore
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/maggioflix-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/maggioflix-armeabi-v7a.apk
          cp build/app/outputs/bundle/release/app-release.aab dist/maggioflix-google-play.aab
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android
          path: dist/*

  windows:
    if: github.repository != 'edde746/plezy'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache native dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/windows/x64/_deps
          key: maggioflix-windows-native-${{ hashFiles('windows/CMakeLists.txt', 'mpv-build.lock.json') }}

      - name: Install dependencies
        shell: pwsh
        run: flutter pub get --enforce-lockfile --no-example

      - name: Install patched Flutter engine
        shell: pwsh
        run: |
          flutter precache --windows
          .\windows\tool\install-patched-engine.ps1

      - name: Build Windows
        shell: pwsh
        run: flutter build windows --release --build-name=3.${{ github.run_number }}.0 --dart-define=GIT_COMMIT=${{ github.sha }} --dart-define=MAGGIOFLIX_BUILD=${{ github.run_number }}

      - name: Package installer and portable zip
        shell: pwsh
        run: |
          $version = "3.$env:GITHUB_RUN_NUMBER.0"
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath dist\maggioflix-windows-x64-portable.zip
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DVersion=$version" windows\maggioflix-installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup non riuscito" }
          Get-ChildItem dist

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows
          path: dist/*

  macos:
    if: github.repository != 'edde746/plezy'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache CocoaPods
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            macos/Pods
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: maggioflix-macos-pods-${{ hashFiles('**/Podfile.lock') }}

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile --no-example

      - name: Build macOS
        run: flutter build macos --release --build-name=3.${{ github.run_number }}.0 --build-number=$((1000 + ${{ github.run_number }})) --dart-define=GIT_COMMIT=${{ github.sha }} --dart-define=MAGGIOFLIX_BUILD=${{ github.run_number }}

      - name: Package DMG
        run: |
          APP="build/macos/Build/Products/Release/MaggioFlix.app"
          test -d "$APP"
          # Firma ad-hoc (nessun account sviluppatore): serve perché il Mac lo apra.
          codesign --verify --deep --verbose=2 "$APP" || codesign --force --deep --sign - "$APP"
          mkdir -p dist dmg-staging
          cp -R "$APP" dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -format UDZO -srcfolder dmg-staging -volname "MaggioFlix" dist/maggioflix-macos.dmg
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos
          path: dist/*

  release:
    needs: [apk, windows, macos]
    # L'APK esce comunque; Windows e Mac si aggiungono se la loro build è riuscita.
    if: ${{ !cancelled() && needs.apk.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download builds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh dist
          plezy=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          tag="v3.${GITHUB_RUN_NUMBER}"
          gh release create "$tag" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "MaggioFlix v3.${GITHUB_RUN_NUMBER}" \
            --notes "Basato su Plezy ${plezy} (https://github.com/edde746/plezy), licenza GPL-3.0. Commit: ${GITHUB_SHA}" \
            --latest

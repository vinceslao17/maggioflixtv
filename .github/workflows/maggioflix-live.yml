name: MaggioFlix Live (ponte)

# Compila l'immagine Docker del ponte e la pubblica su
# ghcr.io/<account>/maggioflix-live:latest a ogni modifica in server/maggioflix-live.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "server/maggioflix-live/**"
      - ".github/workflows/maggioflix-live.yml"

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: server/maggioflix-live
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/maggioflix-live:latest
            ghcr.io/${{ github.repository_owner }}/maggioflix-live:${{ github.run_number }}
